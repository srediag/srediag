apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: srediag-staging

namespace: observability-staging

resources:
  - ../../base

patchesStrategicMerge:
  - deployment-patch.yaml

images:
  - name: ghcr.io/srediag/srediag
    newTag: staging

replicas:
  - name: srediag
    count: 2

commonLabels:
  environment: staging

namePrefix: staging-