apiVersion: v1
kind: ResourceQuota
metadata:
  name: srediag-quota
  namespace: observability
  labels:
    app.kubernetes.io/name: srediag
    app.kubernetes.io/component: resource-management
spec:
  hard:
    # CPU limits
    requests.cpu: "10"
    limits.cpu: "20"
    
    # Memory limits
    requests.memory: "10Gi"
    limits.memory: "20Gi"
    
    # Storage limits
    requests.storage: "50Gi"
    persistentvolumeclaims: "10"
    
    # Object count limits
    pods: "20"
    services: "10"
    configmaps: "20"
    secrets: "20"
    
---
apiVersion: v1
kind: LimitRange
metadata:
  name: srediag-limits
  namespace: observability
  labels:
    app.kubernetes.io/name: srediag
    app.kubernetes.io/component: resource-management
spec:
  limits:
  - type: Container
    default:
      cpu: "500m"
      memory: "512Mi"
    defaultRequest:
      cpu: "100m"
      memory: "256Mi"
    max:
      cpu: "2"
      memory: "2Gi"
    min:
      cpu: "50m"
      memory: "128Mi"
  - type: PersistentVolumeClaim
    max:
      storage: "10Gi"
    min:
      storage: "1Gi"