apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: srediag
  namespace: observability
  labels:
    app.kubernetes.io/name: srediag
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: srediag
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
    scheme: http
  namespaceSelector:
    matchNames:
    - observability